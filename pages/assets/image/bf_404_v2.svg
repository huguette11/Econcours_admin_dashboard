<svg viewBox="0 0 680 420" width="680" height="420" xmlns="http://www.w3.org/2000/svg">

  <!-- ══════════════════════════════════════════
       FOND : bannière ruban "BURKINA FASO"
  ══════════════════════════════════════════ -->
  <path d="M160 38 Q340 28 520 38 L510 56 Q340 48 170 56 Z"
        fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
  <text x="340" y="51" font-size="15" font-weight="700" font-family="Georgia,serif"
        text-anchor="middle" fill="#333" letter-spacing="3">BURKINA FASO</text>

  <!-- ══════════════════════════════════════════
       CHIFFRE "4" GAUCHE — rouge + cheval cabré
  ══════════════════════════════════════════ -->
  <defs>
    <clipPath id="k4L"><text x="100" y="280" font-size="230" font-weight="900" font-family="Georgia,serif" text-anchor="middle">4</text></clipPath>
    <clipPath id="k0"> <text x="340" y="280" font-size="230" font-weight="900" font-family="Georgia,serif" text-anchor="middle">0</text></clipPath>
    <clipPath id="k4R"><text x="580" y="280" font-size="230" font-weight="900" font-family="Georgia,serif" text-anchor="middle">4</text></clipPath>
  </defs>

  <!-- 4 gauche rouge -->
  <g clip-path="url(#k4L)">
    <rect x="0" y="65" width="200" height="235" fill="#CC0000"/>
    <!-- texture lignes lances diagonales -->
    <line x1="10"  y1="65"  x2="200" y2="300" stroke="#fff" stroke-width="6" opacity="0.07"/>
    <line x1="40"  y1="65"  x2="200" y2="270" stroke="#fff" stroke-width="4" opacity="0.07"/>
    <line x1="0"   y1="110" x2="180" y2="300" stroke="#fff" stroke-width="4" opacity="0.07"/>
    <line x1="70"  y1="65"  x2="200" y2="248" stroke="#fff" stroke-width="3" opacity="0.05"/>
    <!-- cheval cabré simplifié (silhouette path) -->
    <g opacity="0.22">
      <path d="M55 240 Q50 210 58 190 Q62 170 55 155 Q65 148 70 158 Q78 148 74 138
               Q85 132 88 142 Q96 128 100 138 Q105 130 108 140
               Q118 135 112 150 Q118 158 110 165
               Q115 178 105 188 Q108 205 100 218
               Q110 228 108 240 Q95 242 93 232 Q88 222 82 230 Q78 242 65 240 Z"
            fill="#fff"/>
      <path d="M55 240 Q52 252 58 258 Q65 262 70 255"
            fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M93 232 Q94 248 100 254 Q107 258 108 250"
            fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- arcs pulse -->
    <path d="M100 105 Q138 105 138 150 Q138 195 100 210 Q62 195 62 150 Q62 105 100 105"
          fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M100 120 Q128 120 128 150 Q128 180 100 190 Q72 180 72 150 Q72 120 100 120"
          fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" begin="0.35s" repeatCount="indefinite"/>
    </path>
    <path d="M100 135 Q116 135 116 150 Q116 165 100 170 Q84 165 84 150 Q84 135 100 135"
          fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- contour -->
  <text x="100" y="280" font-size="230" font-weight="900" font-family="Georgia,serif"
        text-anchor="middle" fill="none" stroke="#CC0000" stroke-width="2" opacity="0.2">4</text>

  <!-- ══════════════════════════════════════════
       CHIFFRE "0" — drapeau BF + bouclier + étoile
  ══════════════════════════════════════════ -->
  <g clip-path="url(#k0)">
    <!-- moitié haute rouge, moitié basse verte -->
    <rect x="196" y="65" width="288" height="118" fill="#CC0000"/>
    <rect x="196" y="183" width="288" height="117" fill="#009A44"/>
    <!-- lances croisées dans le 0 -->
    <g opacity="0.18">
      <line x1="270" y1="70" x2="410" y2="295" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
      <line x1="410" y1="70" x2="270" y2="295" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
      <polygon points="270,70 262,54 278,60" fill="#222"/>
      <polygon points="410,70 402,54 418,60" fill="#222"/>
    </g>
    <!-- arcs pulse -->
    <path d="M340 100 Q392 100 392 173 Q392 246 340 266 Q288 246 288 173 Q288 100 340 100"
          fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M340 115 Q380 115 380 173 Q380 231 340 248 Q300 231 300 173 Q300 115 340 115"
          fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M340 130 Q368 130 368 173 Q368 216 340 230 Q312 216 312 173 Q312 130 340 130"
          fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M340 145 Q356 145 356 173 Q356 201 340 210 Q324 201 324 173 Q324 145 340 145"
          fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </path>
    <!-- Bouclier central -->
    <path d="M340 148 L358 155 L358 174 Q358 186 340 194 Q322 186 322 174 L322 155 Z"
          fill="#CC0000"/>
    <path d="M340 171 L358 171 L358 174 Q358 186 340 194 Q322 186 322 174 L322 171 Z"
          fill="#009A44"/>
    <path d="M340 148 L358 155 L358 174 Q358 186 340 194 Q322 186 322 174 L322 155 Z"
          fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <!-- Étoile dans le bouclier -->
    <polygon points="340,156 342,163 349,163 344,167 346,174 340,170 334,174 336,167 331,163 338,163"
             fill="#FFD700">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <!-- Anneaux tournants autour du 0 -->
  <circle cx="340" cy="183" r="116" fill="none" stroke="#CC0000" stroke-width="4"
          stroke-dasharray="215 144" stroke-linecap="round" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 340 183" to="360 340 183"
                      dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="183" r="130" fill="none" stroke="#FFD700" stroke-width="3"
          stroke-dasharray="160 248" stroke-linecap="round" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 340 183" to="-360 340 183"
                      dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="183" r="144" fill="none" stroke="#009A44" stroke-width="3"
          stroke-dasharray="120 784" stroke-linecap="round" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 340 183" to="360 340 183"
                      dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <text x="340" y="280" font-size="230" font-weight="900" font-family="Georgia,serif"
        text-anchor="middle" fill="none" stroke="#009A44" stroke-width="2" opacity="0.2">0</text>

  <!-- ══════════════════════════════════════════
       CHIFFRE "4" DROIT — rouge + cheval cabré miroir
  ══════════════════════════════════════════ -->
  <g clip-path="url(#k4R)">
    <rect x="480" y="65" width="200" height="235" fill="#CC0000"/>
    <line x1="670" y1="65"  x2="480" y2="300" stroke="#fff" stroke-width="6" opacity="0.07"/>
    <line x1="640" y1="65"  x2="480" y2="270" stroke="#fff" stroke-width="4" opacity="0.07"/>
    <line x1="680" y1="110" x2="500" y2="300" stroke="#fff" stroke-width="4" opacity="0.07"/>
    <!-- cheval cabré miroir -->
    <g opacity="0.22" transform="scale(-1,1) translate(-680,0)">
      <path d="M55 240 Q50 210 58 190 Q62 170 55 155 Q65 148 70 158 Q78 148 74 138
               Q85 132 88 142 Q96 128 100 138 Q105 130 108 140
               Q118 135 112 150 Q118 158 110 165
               Q115 178 105 188 Q108 205 100 218
               Q110 228 108 240 Q95 242 93 232 Q88 222 82 230 Q78 242 65 240 Z"
            fill="#fff"/>
      <path d="M55 240 Q52 252 58 258 Q65 262 70 255"
            fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M93 232 Q94 248 100 254 Q107 258 108 250"
            fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M580 105 Q618 105 618 150 Q618 195 580 210 Q542 195 542 150 Q542 105 580 105"
          fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M580 120 Q608 120 608 150 Q608 180 580 190 Q552 180 552 150 Q552 120 580 120"
          fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" begin="0.35s" repeatCount="indefinite"/>
    </path>
    <path d="M580 135 Q596 135 596 150 Q596 165 580 170 Q564 165 564 150 Q564 135 580 135"
          fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="580" y="280" font-size="230" font-weight="900" font-family="Georgia,serif"
        text-anchor="middle" fill="none" stroke="#CC0000" stroke-width="2" opacity="0.2">4</text>

  <!-- ══════════════════════════════════════════
       BAS : livre ouvert + ruban devise
  ══════════════════════════════════════════ -->
  <!-- Livre ouvert simplifié -->
  <path d="M300 308 Q320 298 340 308 Q360 298 380 308 L380 328 Q360 318 340 328 Q320 318 300 328 Z"
        fill="#ccc" stroke="#aaa" stroke-width="1"/>
  <line x1="340" y1="308" x2="340" y2="328" stroke="#aaa" stroke-width="1"/>
  <!-- Lignes de texte sur le livre -->
  <line x1="308" y1="314" x2="336" y2="314" stroke="#999" stroke-width="1"/>
  <line x1="308" y1="319" x2="336" y2="319" stroke="#999" stroke-width="1"/>
  <line x1="344" y1="314" x2="372" y2="314" stroke="#999" stroke-width="1"/>
  <line x1="344" y1="319" x2="372" y2="319" stroke="#999" stroke-width="1"/>

  <!-- Ruban devise bas -->
  <path d="M130 350 Q170 342 250 348 Q340 342 430 348 Q510 342 550 350 L540 368 Q460 360 340 366 Q220 360 140 368 Z"
        fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
  <!-- Épi de mil gauche -->
  <line x1="148" y1="370" x2="148" y2="340" stroke="#009A44" stroke-width="2"/>
  <ellipse cx="148" cy="338" rx="5" ry="10" fill="#FFD700" opacity="0.9"/>
  <line x1="143" y1="355" x2="138" y2="350" stroke="#009A44" stroke-width="1.5"/>
  <line x1="143" y1="348" x2="136" y2="344" stroke="#009A44" stroke-width="1.5"/>
  <!-- Épi de mil droit -->
  <line x1="532" y1="370" x2="532" y2="340" stroke="#009A44" stroke-width="2"/>
  <ellipse cx="532" cy="338" rx="5" ry="10" fill="#FFD700" opacity="0.9"/>
  <line x1="537" y1="355" x2="542" y2="350" stroke="#009A44" stroke-width="1.5"/>
  <line x1="537" y1="348" x2="544" y2="344" stroke="#009A44" stroke-width="1.5"/>

  <text x="221" y="362" font-size="12" font-family="Georgia,serif" font-style="italic" fill="#444">La Patrie</text>
  <text x="317" y="360" font-size="12" font-family="Georgia,serif" font-style="italic" fill="#444">ou la Mort</text>
  <text x="420" y="362" font-size="12" font-family="Georgia,serif" font-style="italic" fill="#444">nous Vaincrons</text>

  <!-- Bande tricolore finale -->
  <rect x="100" y="382" width="480" height="5" rx="3" fill="#CC0000"/>
  <rect x="100" y="389" width="480" height="5" rx="3" fill="#FFD700"/>
  <rect x="100" y="396" width="480" height="5" rx="3" fill="#009A44"/>

</svg>
